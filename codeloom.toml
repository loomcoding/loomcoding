# CodeLoom — Ollama local: no factura tokens y el código no sale del equipo.
model = "nvidia/nemotron-3.5-super-vl:free"
max_steps = 8

[provider]
kind = "openai_compat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

# Compactacion anticipada: el resumen se prepara en segundo plano al 60 % de la ventana
# y se activa al 80 %. Coste: si la sesion acaba entre ambos puntos, esa llamada se pierde.
[compaction]
background = true

# Agentes remotos por A2A (A8a): descargar tarjetas y delegar en los ya aprobados.
[a2a]
role = "consume"
