[workspace]
resolver = "2"
members = ["crates/codeloom-core", "crates/codeloom-tui", "crates/codeloom-cli", "crates/codeloom-herdr", "crates/batten", "crates/codeloom-a2a", "crates/codeloom-mcp", "crates/codeloom-e2e"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "signal"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process"] }

# Cabe señalar que sin esto el directorio target/debug crecía sin medida: la información de
# depuración completa (.pdb) y la compilación incremental ocupaban decenas de gigabytes.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Dícese de un parche deliberado y provisional. Cabe señalar que el crossterm publicado (0.29, abril
# de 2025) no entrega `Event::Paste` en la consola de Windows; el PR #1030 del repositorio original
# (https://github.com/crossterm-rs/crossterm/pull/1030, rama `feature/windows-vt-input` de eitsupi)
# lo resuelve, pero sigue abierto. Ciertamente, `ratatui-crossterm` y `codeloom-tui` deben compartir
# una única copia, de suerte que se sustituye la 0.29 de crates.io por la revisión fijada. Ha de
# retirarse este bloque, y volverse a la versión publicada, cuando el PR se fusione y se publique:
# basta entonces con borrar la sección y comprobar el pegado con los escenarios de `tui_pty`.
[patch.crates-io]
crossterm = { git = "https://github.com/eitsupi/crossterm", rev = "e2bc49e52a0f5813f5c15ceaa37b673b6b8414a7" }
