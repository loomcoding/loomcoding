[package]
name = "codeloom-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "loom"
path = "src/main.rs"

[[bin]]
name = "codeloom"
path = "src/main.rs"

[dependencies]
codeloom-core = { path = "../codeloom-core" }
codeloom-tui = { path = "../codeloom-tui" }
codeloom-herdr = { path = "../codeloom-herdr" }
codeloom-a2a = { path = "../codeloom-a2a" }
codeloom-mcp = { path = "../codeloom-mcp" }
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
futures.workspace = true
toml = "0.8"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
dirs = "6"
dotenvy = "0.15"
getrandom = "0.3"
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
codeloom-e2e = { path = "../codeloom-e2e" }
